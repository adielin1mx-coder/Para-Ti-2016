<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Ti 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Josefin+Sans:wght@200;300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4a843;
    --gold-light: #f0c96a;
    --gold-pale: #f7e4a8;
    --gold-deep: #a8782a;
    --cream: #fdf6e3;
    --dark: #0d0b08;
    --text: #e8dcc8;
    --dim: #9a8c78;
    --line: rgba(212, 168, 67, .2);
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Josefin Sans', system-ui, sans-serif;
    --script: 'Pinyon Script', 'Cormorant Garamond', cursive;
    --hand: 'Caveat', 'Segoe Print', cursive;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: var(--serif);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection { background: rgba(212, 168, 67, .35); color: var(--cream); }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 1px solid var(--gold-light); outline-offset: 4px; border-radius: 8px; }
  img { display: block; max-width: 100%; }

  /* ───── Capas de fondo ───── */
  .aurora { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; filter: blur(30px); transform: scale(1.12); pointer-events: none; }
  .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(13, 11, 8, .78) 100%); }
  .decor { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .decor-item { position: absolute; opacity: 0; }
  .decor-item svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 14px rgba(212, 168, 67, .25)); }
  .petal-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  .spark-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4000; pointer-events: none; }
  .grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 900; opacity: .45;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .float { width: 100%; height: 100%; animation: float 6s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-6px) rotate(-1deg); }
    50% { transform: translateY(-10px) rotate(1deg); }
    75% { transform: translateY(-4px) rotate(0); }
  }

  main { position: relative; z-index: 5; }
  main > section { position: relative; padding: 110px 20px; }

  /* ───── Texto animado (estilo React Bits) ───── */
  .word { display: inline-block; white-space: nowrap; }
  .ch, .bw { display: inline-block; opacity: 0; will-change: transform, opacity, filter; }
  .shiny {
    background: linear-gradient(110deg, var(--gold) 30%, #fff7dc 48%, var(--gold-light) 52%, var(--gold) 70%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 5s linear infinite;
  }
  @keyframes shine { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }

  .script-line { font-family: var(--script); font-size: clamp(1.7rem, 4.5vw, 2.4rem); line-height: 1.2; padding: 0 .15em; }
  .divider { width: 110px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 30px auto 0; position: relative; }
  .divider::after { content: '✦'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%); font-size: .7rem; color: var(--gold); text-shadow: 0 0 10px var(--gold); }

  /* ───── Portada / sobre ───── */
  .gate {
    position: fixed; inset: 0; z-index: 3000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    text-align: center; padding: 30px;
    background: radial-gradient(ellipse at 50% 40%, #1f180e 0%, #0d0b08 70%);
  }
  .gate .g-orchid { width: 120px; height: 144px; opacity: 0; }
  .gate .g-line { opacity: 0; }
  .gate .g-for { font-family: var(--script); font-size: clamp(2.4rem, 8vw, 3.6rem); color: var(--gold-light); line-height: 1.1; }
  .gate .g-txt { font-style: italic; font-size: 1.25rem; color: var(--text); }
  .seal {
    position: relative; margin-top: 10px; width: 116px; height: 116px; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle at 35% 30%, #f5d27a, #c9932a 55%, #8a5f1c);
    color: #2a1a06; font-family: var(--script); font-size: 1.9rem;
    box-shadow: 0 14px 40px -10px rgba(212, 168, 67, .7), inset 0 -6px 14px rgba(0, 0, 0, .25), inset 0 4px 10px rgba(255, 255, 255, .35);
    display: flex; align-items: center; justify-content: center;
  }
  .seal::before, .seal::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(212, 168, 67, .5); animation: ring 2.4s ease-out infinite; }
  .seal::after { animation-delay: 1.2s; }
  @keyframes ring { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
  .g-hint { font-family: var(--sans); font-weight: 300; font-size: .75rem; letter-spacing: .12em; color: var(--dim); opacity: 0; }

  /* ───── Hero ───── */
  .hero {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 100px 20px 140px !important;
  }
  .hero .script-line { opacity: 0; font-size: clamp(2rem, 6vw, 3rem); }
  .hero h1 {
    font-weight: 300; font-style: italic; color: var(--cream);
    font-size: clamp(3rem, 9vw, 6.4rem); line-height: 1.02; margin-top: 10px;
    text-shadow: 0 0 40px rgba(212, 168, 67, .25);
  }
  .hero-phrase { font-style: italic; font-weight: 300; font-size: clamp(1.1rem, 2.6vw, 1.4rem); color: var(--gold-pale); margin-top: 24px; letter-spacing: .04em; }
  .hero .divider { opacity: 0; }
  .scroll-hint {
    position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0;
    font-family: var(--sans); font-weight: 300; font-size: .75rem; letter-spacing: .15em; color: var(--dim); text-decoration: none;
  }
  .scroll-hint .line { width: 1px; height: 46px; background: linear-gradient(var(--gold), transparent); animation: drip 2.2s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); opacity: 0; } 40% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }

  /* ───── Encabezados de sección ───── */
  .sec-head { text-align: center; margin: 0 auto 64px; max-width: 720px; }
  .sec-head .script-line { opacity: 0; }
  .sec-head h2 { font-weight: 300; font-style: italic; color: var(--cream); font-size: clamp(2rem, 5vw, 3.3rem); line-height: 1.15; margin-top: 8px; }
  .sec-head p { color: var(--dim); font-style: italic; margin-top: 12px; font-size: 1.15rem; }
  .sec-head .divider { opacity: 0; }

  /* ───── Jardín de orquídeas ───── */
  .garden { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; max-width: 1180px; margin: 0 auto; }
  .orchid-card {
    position: relative; opacity: 0; border-radius: 28px; padding: 34px 22px 32px;
    background: linear-gradient(160deg, rgba(30, 24, 15, .78), rgba(14, 11, 8, .7));
    border: 1px solid var(--line); overflow: hidden;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    transition: border-color .4s, box-shadow .4s;
  }
  .orchid-card::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 30%), rgba(240, 201, 106, .14), transparent 45%);
  }
  .orchid-card:hover::before { opacity: 1; }
  .orchid-card:hover { border-color: rgba(212, 168, 67, .45); box-shadow: 0 20px 60px -20px rgba(212, 168, 67, .25); }
  .orchid-wrap { width: 160px; height: 200px; cursor: pointer; }
  .orchid-svg { width: 100%; height: 100%; overflow: visible; }
  .pt, .lf { opacity: 0; }
  .num { font-family: var(--script); font-size: 1.9rem; color: var(--gold); opacity: 0; line-height: 1; }
  .msg { text-align: center; font-style: italic; font-weight: 300; font-size: 1.25rem; line-height: 1.55; color: var(--text); opacity: 0; max-width: 240px; }

  /* ───── Galería (polaroids) ───── */
  .gallery { columns: 3 260px; column-gap: 34px; max-width: 1120px; margin: 0 auto; }
  .pol-wrap { break-inside: avoid; display: inline-block; width: 100%; margin: 0 0 40px; padding-top: 12px; opacity: 0; }
  .pol {
    position: relative; background: #f6efe0; padding: 14px 14px 0; border-radius: 4px; cursor: zoom-in;
    box-shadow: 0 30px 60px -25px rgba(0, 0, 0, .85), 0 0 0 1px rgba(255, 255, 255, .04);
    transition: transform .25s ease-out, box-shadow .3s; will-change: transform;
  }
  .pol:hover { box-shadow: 0 40px 80px -25px rgba(0, 0, 0, .9), 0 0 40px -10px rgba(212, 168, 67, .35); }
  .pol .photo { position: relative; overflow: hidden; background: #1a1510; }
  .pol .photo-media { width: 100%; height: auto; filter: sepia(1) brightness(1.5) blur(6px); }
  .pol .develop { position: absolute; inset: 0; background: linear-gradient(135deg, #efe3c8, #d9c7a0); pointer-events: none; }
  .pol .glare {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; mix-blend-mode: soft-light;
    background: radial-gradient(300px circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, .7), transparent 60%);
  }
  .pol:hover .glare { opacity: 1; }
  .pol .cap { font-family: var(--hand); font-size: 1.5rem; color: #4a3b25; text-align: center; padding: 12px 6px 16px; opacity: 0; line-height: 1.2; }
  .pol .tape {
    position: absolute; top: -11px; left: 50%; width: 86px; height: 24px; z-index: 2;
    transform: translateX(-50%) rotate(-3deg); background: rgba(247, 228, 168, .5); box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
  }
  .ph-empty {
    aspect-ratio: 4 / 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: radial-gradient(circle at 50% 40%, #2b2217, #120e09); color: var(--gold-pale);
    font-family: var(--sans); font-weight: 300; font-size: .85rem; text-align: center; padding: 20px;
  }
  .ph-empty .mo { width: 54px; height: 65px; }
  .ph-empty code { font-family: ui-monospace, monospace; color: var(--dim); font-size: .75rem; word-break: break-all; }

  .lightbox { position: fixed; inset: 0; z-index: 1500; background: rgba(8, 6, 4, .94); display: flex; align-items: center; justify-content: center; padding: 70px 20px; opacity: 0; }
  .lb-inner { position: relative; max-width: min(92vw, 900px); text-align: center; }
  .lb-inner img { max-height: 76vh; width: auto; margin: 0 auto; border-radius: 6px; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); }
  .lb-inner .ph-empty { width: min(80vw, 420px); margin: 0 auto; border-radius: 6px; }
  .lb-cap { font-family: var(--hand); font-size: 1.8rem; color: var(--gold-pale); margin-top: 14px; }
  .lb-btn {
    position: fixed; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
    background: rgba(22, 18, 12, .75); display: flex; align-items: center; justify-content: center; color: var(--gold-light); z-index: 2;
  }
  .lb-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 16px; top: 50%; transform: translateY(-50%); }
  .lb-close { right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); }

  /* ───── Playlist ───── */
  .player-card {
    max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 44px; padding: 44px;
    border-radius: 32px; background: linear-gradient(160deg, rgba(32, 25, 15, .8), rgba(12, 10, 7, .8));
    border: 1px solid var(--line); box-shadow: 0 40px 100px -40px rgba(0, 0, 0, .9);
  }
  .deck { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .turntable { position: relative; width: min(280px, 68vw); aspect-ratio: 1; }
  .vinyl {
    position: absolute; inset: 0; border-radius: 50%;
    background: repeating-radial-gradient(circle, #171410 0 1px, #0c0a08 1.5px 3px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .7), inset 0 0 0 6px #0a0806;
    animation: spin 3.2s linear infinite; animation-play-state: paused;
  }
  .vinyl.on { animation-play-state: running; }
  .vinyl::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 10%, rgba(255, 240, 200, .09) 15%, transparent 22% 55%, rgba(255, 240, 200, .06) 62%, transparent 70%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vlabel {
    position: absolute; inset: 33%; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, var(--gold-light), var(--gold) 55%, var(--gold-deep));
    box-shadow: 0 0 20px rgba(212, 168, 67, .35);
  }
  .vlabel span { position: absolute; left: 0; right: 0; top: 14%; text-align: center; font-family: var(--script); color: #2a1e0c; font-size: 1.6rem; }
  .vlabel::after { content: ''; position: absolute; left: 45%; top: 45%; width: 10%; height: 10%; background: #0d0b08; border-radius: 50%; }
  .arm { position: absolute; top: -4%; right: -6%; width: 34%; height: 70%; transform-origin: 78% 10%; transform: rotate(-28deg); transition: transform .9s cubic-bezier(.22, 1, .36, 1); z-index: 2; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); }
  .arm.on { transform: rotate(0deg); }
  .now { text-align: center; min-height: 92px; }
  .now .t { font-size: 1.9rem; font-style: italic; color: var(--cream); font-weight: 300; line-height: 1.2; }
  .now .a { font-family: var(--sans); font-weight: 300; font-size: .85rem; letter-spacing: .06em; color: var(--gold); margin-top: 6px; }
  .now .nota { font-family: var(--hand); font-size: 1.35rem; color: var(--gold-pale); margin-top: 8px; }
  .now .err { font-family: var(--sans); font-size: .75rem; color: #e39a86; margin-top: 10px; }
  .bar { width: 100%; max-width: 340px; }
  .track { position: relative; height: 20px; cursor: pointer; touch-action: none; }
  .track .bg { position: absolute; left: 0; right: 0; top: 50%; height: 3px; transform: translateY(-50%); background: rgba(212, 168, 67, .18); border-radius: 3px; }
  .track .fill { position: absolute; left: 0; top: 50%; height: 3px; transform: translateY(-50%); background: linear-gradient(90deg, var(--gold-deep), var(--gold-light)); border-radius: 3px; box-shadow: 0 0 10px rgba(240, 201, 106, .5); }
  .track .knob { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--cream); transform: translate(-50%, -50%); box-shadow: 0 0 12px var(--gold); }
  .times { display: flex; justify-content: space-between; font-family: var(--sans); font-weight: 300; font-size: .72rem; color: var(--dim); margin-top: 4px; }
  .controls { display: flex; align-items: center; gap: 22px; }
  .ctl { position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold-pale); transition: transform .2s, color .2s; flex-shrink: 0; }
  .ctl:hover { transform: scale(1.1); color: var(--cream); }
  .ctl svg { width: 20px; height: 20px; fill: currentColor; }
  .ctl.main { width: 64px; height: 64px; color: #1a1206; background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, var(--gold-deep)); box-shadow: 0 10px 30px -8px rgba(212, 168, 67, .6); }
  .ctl.main:hover { color: #1a1206; }
  .ctl.main svg { width: 24px; height: 24px; }
  .ctl.main.on::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid rgba(212, 168, 67, .55); animation: ring 2s ease-out infinite; }

  .list h3 { font-family: var(--script); font-weight: 400; font-size: 2rem; color: var(--gold); margin-bottom: 14px; }
  .songs { display: flex; flex-direction: column; gap: 6px; max-height: 430px; overflow-y: auto; padding-right: 6px; }
  .songs::-webkit-scrollbar { width: 4px; }
  .songs::-webkit-scrollbar-thumb { background: rgba(212, 168, 67, .35); border-radius: 4px; }
  .song {
    width: 100%; display: grid; grid-template-columns: 34px 1fr 24px; align-items: center; gap: 14px; padding: 14px 16px;
    border-radius: 16px; text-align: left; border: 1px solid transparent; transition: background .3s, border-color .3s; opacity: 0;
  }
  .song:hover { background: rgba(212, 168, 67, .07); }
  .song.active { background: linear-gradient(90deg, rgba(212, 168, 67, .16), rgba(212, 168, 67, .04)); border-color: var(--line); }
  .song .n { font-family: var(--sans); font-weight: 300; font-size: .8rem; color: var(--dim); display: flex; justify-content: center; }
  .song .st { display: block; font-size: 1.22rem; color: var(--cream); font-style: italic; line-height: 1.25; }
  .song .sa { display: block; font-family: var(--sans); font-weight: 300; font-size: .75rem; color: var(--dim); margin-top: 3px; }
  .song .pi { color: var(--gold); display: flex; }
  .song .pi svg { width: 16px; height: 16px; fill: currentColor; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq span { display: block; width: 3px; height: 4px; background: var(--gold); border-radius: 2px; }
  .eq.on span { animation: eq .9s ease-in-out infinite; }
  .eq.on span:nth-child(2) { animation-delay: .15s; }
  .eq.on span:nth-child(3) { animation-delay: .3s; }
  .eq.on span:nth-child(4) { animation-delay: .45s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 14px; } }

  /* ───── Mini reproductor flotante ───── */
  .mini-wrap { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 1200; display: flex; justify-content: center; pointer-events: none; padding: 0 12px; }
  .mini {
    position: relative; pointer-events: auto; opacity: 0; max-width: 100%;
    display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px 18px; border-radius: 60px;
    background: rgba(20, 16, 10, .85); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
  }
  .mini .info { display: flex; flex-direction: column; min-width: 0; width: 160px; text-align: left; }
  .mini .mt { font-size: 1rem; font-style: italic; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .ma { font-family: var(--sans); font-weight: 300; font-size: .68rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .ctl { width: 36px; height: 36px; }
  .mini .ctl svg { width: 15px; height: 15px; }
  .mini .ctl.main { width: 42px; height: 42px; }
  .mini .ctl.main svg { width: 17px; height: 17px; }
  .mini-progress { position: absolute; left: 24px; right: 24px; bottom: 4px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(212, 168, 67, .12); }
  .mini-progress div { height: 100%; background: var(--gold); }

  /* ───── Carta final ───── */
  .finale { text-align: center; padding: 120px 20px 220px !important; }
  .letter {
    max-width: 680px; margin: 0 auto; padding: 56px 36px 50px; border-radius: 30px; opacity: 0;
    background: linear-gradient(170deg, rgba(34, 27, 16, .82), rgba(14, 11, 8, .82));
    border: 1px solid var(--line); box-shadow: 0 40px 100px -40px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(247, 228, 168, .08);
  }
  .letter .l-orchid { width: 64px; height: 77px; margin: 0 auto 22px; }
  .letter p { font-size: clamp(1.45rem, 3.8vw, 2.1rem); font-style: italic; font-weight: 300; color: var(--cream); line-height: 1.55; }
  .letter .sign { font-family: var(--script); font-size: clamp(1.9rem, 5vw, 2.6rem); color: var(--gold-light); margin-top: 26px; opacity: 0; }
  .letter .small { font-family: var(--sans); font-weight: 300; font-size: .78rem; color: var(--dim); margin-top: 30px; opacity: 0; }

  /* ───── Overlay final ───── */
  .overlay {
    position: fixed; inset: 0; z-index: 1100; display: flex; align-items: center; justify-content: center; padding: 40px 24px;
    background: radial-gradient(ellipse at center, rgba(13, 11, 8, .5), rgba(13, 11, 8, .96));
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease; overflow: hidden;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .fo { position: absolute; opacity: 0; }
  .ov-box { position: relative; z-index: 2; text-align: center; opacity: 0; }

function useInView(ref, { threshold = 0.2, once = true, rootMargin = '0px' } = {}) {
  const [v, setV] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setV(true); if (once) io.disconnect(); }
      else if (!once) setV(false);
    }, { threshold, rootMargin });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return v;
}

function usePlayer(songs) {
  const aRef = useRef(null);
  if (!aRef.current) { const a = new Audio(); a.preload = 'metadata'; aRef.current = a; }
  const idxRef = useRef(0);
  const [index, setIndex] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [time, setTime] = useState(0);
  const [duration, setDuration] = useState(0);
  const [error, setError] = useState('');

  const load = useCallback((i, autoplay) => {
    const a = aRef.current;
    idxRef.current = i;
    setIndex(i); setError(''); setTime(0); setDuration(0);
    a.src = songs[i].src;
    a.load();
    if (autoplay) a.play().catch(() => {});
  }, []);

  useEffect(() => {
    const a = aRef.current;
    a.src = songs[0].src;
    const on = {
      play: () => setPlaying(true),
      pause: () => setPlaying(false),
      timeupdate: () => setTime(a.currentTime),
      loadedmetadata: () => setDuration(isFinite(a.duration) ? a.duration : 0),
      ended: () => {
        if (songs.length > 1) load((idxRef.current + 1) % songs.length, true);
        else { a.currentTime = 0; a.play().catch(() => {}); }
      },
      error: () => { setPlaying(false); setError('No encontré el archivo: ' + songs[idxRef.current].src); },
    };
    Object.entries(on).forEach(([k, f]) => a.addEventListener(k, f));
    return () => { Object.entries(on).forEach(([k, f]) => a.removeEventListener(k, f)); a.pause(); };
  }, []);

  const play   = () => { aRef.current.play().catch(() => {}); };
  const toggle = () => { const a = aRef.current; if (a.paused) a.play().catch(() => {}); else a.pause(); };
  const next   = () => load((idxRef.current + 1) % songs.length, true);
  const prev   = () => {
    const a = aRef.current;
    if (a.currentTime > 3) { a.currentTime = 0; return; }
    load((idxRef.current - 1 + songs.length) % songs.length, true);
  };
  const select = (i) => { if (i === idxRef.current) toggle(); else load(i, true); };
  const seek   = (r) => { const a = aRef.current; if (a.duration && isFinite(a.duration)) a.currentTime = r * a.duration; };

  return { index, playing, time, duration, error, play, toggle, next, prev, select, seek };
}

// Aurora: fondo de luz dorada en movimiento
function Aurora() {
  const ref = useRef();
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d');
    let raf;
    const blobs = [
      { h: '212,168,67',  r: .55, sx: .00021, sy: .00017, ox: .3, oy: .25, a: .34 },
      { h: '196,112,98',  r: .5,  sx: .00013, sy: .00023, ox: .7, oy: .35, a: .18 },
      { h: '160,98,40',   r: .6,  sx: .00018, sy: .00011, ox: .5, oy: .8,  a: .28 },
      { h: '240,201,106', r: .35, sx: .00027, sy: .00019, ox: .8, oy: .7,  a: .16 },
    ];
    const resize = () => { c.width = Math.ceil(innerWidth / 6); c.height = Math.ceil(innerHeight / 6); };
    resize();
    addEventListener('resize', resize);
    const draw = (now) => {
      const w = c.width, h = c.height;
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      blobs.forEach((b, i) => {
        const x = (b.ox + Math.sin(now * b.sx + i) * .25) * w;
        const y = (b.oy + Math.cos(now * b.sy + i * 2) * .2) * h;
        const r = b.r * Math.max(w, h) * (.85 + Math.sin(now * .0004 + i) * .15);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(${b.h},${b.a})`);
        g.addColorStop(1, `rgba(${b.h},0)`);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      });
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={ref} className="aurora" aria-hidden="true" />;
}

// Pétalos cayendo con giro 3D
function PetalRain({ count = 22 }) {
  const ref = useRef();
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w, h, raf;
    const resize = () => { w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize();
    addEventListener('resize', resize);
    const mk = (initial) => ({
      x: Math.random() * w, y: initial ? Math.random() * h : -30 - Math.random() * h * .4,
      s: 5 + Math.random() * 7, vy: .35 + Math.random() * .7, sway: .4 + Math.random() * 1.2,
      ph: Math.random() * Math.PI * 2, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .03,
      flip: Math.random() * 6.28, vf: .01 + Math.random() * .03, a: .25 + Math.random() * .4,
    });
    const ps = Array.from({ length: count }, () => mk(true));
    let last = performance.now();
    const draw = (now) => {
      const dt = Math.min(3, (now - last) / 16.67); last = now;
      ctx.clearRect(0, 0, w, h);
      for (const p of ps) {
        p.ph += .012 * dt; p.y += p.vy * dt; p.x += Math.sin(p.ph) * p.sway * .6 * dt;
        p.rot += p.vr * dt; p.flip += p.vf * dt;
        if (p.y > h + 30) Object.assign(p, mk(false));
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.abs(Math.cos(p.flip)) * .8 + .2);
        ctx.globalAlpha = p.a;
        const g = ctx.createLinearGradient(0, -p.s, 0, p.s);
        g.addColorStop(0, '#f7e4a8');
        g.addColorStop(1, '#c9932a');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.s * .55, p.s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', resize); };
  }, []);
  return <canvas ref={ref} className="petal-canvas" aria-hidden="true" />;
}

// ClickSpark: chispas doradas en cada toque
function ClickSpark({ color = '#f0c96a', count = 9, radius = 30, size = 11, duration = 550 }) {
  const ref = useRef();
  useEffect(() => {
    const c = ref.current, ctx = c.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let sparks = [], raf = null;
    const resize = () => { c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    resize();
    addEventListener('resize', resize);
    const draw = (now) => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      sparks = sparks.filter((s) => {
        const p = (now - s.t) / duration;
        if (p >= 1) return false;
        const e = 1 - Math.pow(1 - p, 3);
        const d = e * radius, len = size * (1 - e);
        ctx.strokeStyle = color; ctx.globalAlpha = 1 - p * .6; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(s.x + d * Math.cos(s.a), s.y + d * Math.sin(s.a));
        ctx.lineTo(s.x + (d + len) * Math.cos(s.a), s.y + (d + len) * Math.sin(s.a));
        ctx.stroke();
        return true;
      });
      raf = sparks.length ? requestAnimationFrame(draw) : null;
    };
    const onDown = (e) => {
      const t = performance.now();
      for (let i = 0; i < count; i++) sparks.push({ x: e.clientX, y: e.clientY, a: (2 * Math.PI * i) / count + Math.random() * .2, t });
      if (!raf) raf = requestAnimationFrame(draw);
    };
    addEventListener('pointerdown', onDown);
    return () => { removeEventListener('pointerdown', onDown); removeEventListener('resize', resize); if (raf) cancelAnimationFrame(raf); };
  }, []);
  return <canvas ref={ref} className="spark-canvas" aria-hidden="true" />;
}

// SplitText: letra por letra
function SplitText({ text, start = true, delay = 0 }) {
  const ref = useRef(), done = useRef(false);
  useEffect(() => {
    if (!start || done.current) return;
    done.current = true;
    anime({
      targets: ref.current.querySelectorAll('.ch'),
      opacity: [0, 1], translateY: [50, 0], rotate: [10, 0], filter: ['blur(10px)', 'blur(0px)'],
      duration: 1500, delay: anime.stagger(50, { start: delay }), easing: 'easeOutExpo',
    });
  }, [start]);
  const words = text.split(' ');
  return (
    <span ref={ref} aria-label={text}>
      {words.map((w, wi) => (
        <React.Fragment key={wi}>
          <span className="word" aria-hidden="true">{[...w].map((c, ci) => <span key={ci} className="ch">{c}</span>)}</span>
          {wi < words.length - 1 ? ' ' : ''}
        </React.Fragment>
      ))}
    </span>
  );
}

  const ref = useRef(), leaving = useRef(false);
  useEffect(() => {
    const el = ref.current;
    anime.timeline({ easing: 'easeOutExpo' })
      .add({ targets: el.querySelector('.g-orchid'), opacity: [0, 1], scale: [.4, 1], rotate: [-20, 0], duration: 1600, easing: 'easeOutElastic(1, .7)', delay: 300 })

function Polaroid({ foto, i, onOpen }) {
  const ref = useRef(), inner = useRef();
  const inView = useInView(ref, { threshold: .2 });
  const [err, setErr] = useState(false);
  const rot = ((i * 47) % 7 - 3) * 1.1 || 1.5;

  useEffect(() => {
    if (!inView) return;
    const el = ref.current;
    anime.timeline({ easing: 'easeOutExpo' })
      .add({ targets: el, opacity: [0, 1], translateY: [90, 0], rotate: [rot * 5, rot], scale: [.8, 1], duration: 1500, delay: (i % 3) * 160 })
      .add({ targets: el.querySelector('.develop'), opacity: [1, 0], duration: 2400, easing: 'easeInOutQuad' }, '-=1000')
      .add({ targets: el.querySelector('.photo-media'), filter: ['sepia(1) brightness(1.5) blur(6px)', 'sepia(0) brightness(1) blur(0px)'], duration: 2600, easing: 'easeOutQuad' }, '-=2400')
      .add({ targets: el.querySelector('.cap'), opacity: [0, 1], translateY: [10, 0], duration: 900 }, '-=1400');
  }, [inView]);

  const onMove = (e) => {
    const n = inner.current, r = n.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    n.style.transform = `perspective(900px) rotateX(${(-y * 14).toFixed(2)}deg) rotateY(${(x * 14).toFixed(2)}deg) scale(1.04)`;
    n.style.setProperty('--gx', `${(x + .5) * 100}%`);
    n.style.setProperty('--gy', `${(y + .5) * 100}%`);
  };
  const onLeave = () => { inner.current.style.transform = ''; };

  return (
    <div className="pol-wrap" ref={ref}>
      <div className="pol" ref={inner} onMouseMove={onMove} onMouseLeave={onLeave} onClick={onOpen}
        role="button" tabIndex={0} onKeyDown={(e) => { if (e.key === 'Enter') onOpen(); }} aria-label={`Ver foto: ${foto.texto}`}>
        <span className="tape" />
        <div className="photo">
          {err ? <EmptyPhoto src={foto.src} /> : <img className="photo-media" src={foto.src} alt={foto.texto} loading="lazy" onError={() => setErr(true)} />}
          <div className="develop" />
          <div className="glare" />
        </div>
        <div className="cap">{foto.texto}</div>
      </div>
    </div>
  );
}

function Lightbox({ idx, setIdx }) {
  const ref = useRef(), tx = useRef(0);
  const [err, setErr] = useState(false);
  const f = FOTOS[idx];
  const go = (d) => setIdx((i) => (i + d + FOTOS.length) % FOTOS.length);

  useEffect(() => {
    anime({ targets: ref.current, opacity: [0, 1], duration: 400, easing: 'linear' });
    const k = (e) => {
      if (e.key === 'Escape') setIdx(null);
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
    };
    addEventListener('keydown', k);
    document.body.style.overflow = 'hidden';
    return () => { removeEventListener('keydown', k); document.body.style.overflow = ''; };
  }, []);

  useEffect(() => {
    setErr(false);
    anime({ targets: ref.current.querySelector('.lb-inner'), opacity: [0, 1], scale: [.92, 1], duration: 700, easing: 'easeOutExpo' });
  }, [idx]);

  return (
    <div className="lightbox" ref={ref}
      onClick={(e) => { if (e.target === e.currentTarget) setIdx(null); }}
      onTouchStart={(e) => { tx.current = e.touches[0].clientX; }}
      onTouchEnd={(e) => { const dx = e.changedTouches[0].clientX - tx.current; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); }}>
      <button className="lb-btn lb-close" onClick={() => setIdx(null)} aria-label="Cerrar">{Icon.close}</button>
      <button className="lb-btn lb-prev" onClick={() => go(-1)} aria-label="Foto anterior">{Icon.left}</button>
      <button className="lb-btn lb-next" onClick={() => go(1)} aria-label="Foto siguiente">{Icon.right}</button>
      <div className="lb-inner">
        {err ? <EmptyPhoto src={f.src} /> : <img src={f.src} alt={f.texto} onError={() => setErr(true)} />}
        <div className="lb-cap">{f.texto}</div>
      </div>
    </div>
  );
}

/* ───────────────────────── Playlist ───────────────────────── */
function Progress({ time, duration, onSeek }) {
  const ref = useRef();
  const [drag, setDrag] = useState(null);
  const ratio = drag !== null ? drag : (duration ? time / duration : 0);
  const calc = (e) => {
    const r = ref.current.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };
  return (
    <div className="bar">
      <div className="track" ref={ref}
        onPointerDown={(e) => { ref.current.setPointerCapture(e.pointerId); setDrag(calc(e)); }}
        onPointerMove={(e) => { if (drag !== null) setDrag(calc(e)); }}
        onPointerUp={(e) => { if (drag !== null) { onSeek(calc(e)); setDrag(null); } }}
        onPointerCancel={() => setDrag(null)}>
        <div className="bg" />
        <div className="fill" style={{ width: `${ratio * 100}%` }} />
        <div className="knob" style={{ left: `${ratio * 100}%` }} />
      </div>
      <div className="times"><span>{fmt(drag !== null ? drag * duration : time)}</span><span>{fmt(duration)}</span></div>
    </div>
  );
}

    const fos = el.querySelectorAll('.fo'), box = el.querySelector('.ov-box');
    anime.remove(fos); anime.remove(box);
    anime({ targets: fos, opacity: [0, .85], scale: [.1, 1], rotate: [() => anime.random(-40, -15), 0], duration: 1800, delay: () => anime.random(0, 1100), easing: 'easeOutElastic(1, .7)' });
    anime({ targets: box, opacity: [0, 1], scale: [.9, 1], translateY: [24, 0], duration: 1600, delay: 700, easing: 'easeOutExpo' });
  }, [visible]);

  return (
    <div ref={ref} className={'overlay' + (visible ? ' visible' : '')} aria-hidden={!visible}>
      {items.map((it, i) => (
        <div key={i} className="fo" style={{ width: it.size, height: it.size * 1.2, left: `calc(${it.left}% - ${it.size / 2}px)`, top: `calc(${it.top}% - ${it.size * .6}px)` }}>
          <div className="float" style={{ animationDuration: `${it.dur}s`, animationDelay: `${-i * .3}s` }}>
            <MiniOrchid id={'fo' + i} col={PALETTE[i % PALETTE.length]} />
          </div>
        </div>
      ))}
      <div className="ov-box">
        <h2>{CONFIG.overlayTitulo.map((l, i) => <span key={i}>{l}</span>)}</h2>
        <div className="ov-sub shiny">{CONFIG.overlaySub}</div>
        <button className="ov-close" onClick={onClose}>Seguir viendo</button>
      </div>
    </div>
  );
});

/* ───────────────────────── App ───────────────────────── */
function App() {
  const player = usePlayer(CANCIONES);
  const [stage, setStage] = useState('gate'); // gate → reveal → gone
  const opened = stage !== 'gate';
  const [lb, setLb] = useState(null);
  const [atEnd, setAtEnd] = useState(false);
  const [dismissed, setDismissed] = useState(false);

  useEffect(() => {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  }, []);
  useEffect(() => { document.body.style.overflow = stage === 'gate' ? 'hidden' : ''; }, [stage]);
  useEffect(() => { if (!atEnd) setDismissed(false); }, [atEnd]);

  const closeOverlay = useCallback(() => setDismissed(true), []);
  const showOverlay = atEnd && player.playing && !dismissed;

  return (
    <>
      <Aurora />
      <div className="vignette" />
      <DecorOrchids start={opened} />
      <PetalRain />
      <ClickSpark />
      <div className="grain" />

      {stage !== 'gone' && <Gate onOpen={player.play} onStage={setStage} />}

      <main>
        <Hero start={opened} />
        <Garden />
        <Gallery onOpen={setLb} />
        <Playlist player={player} />
        <Finale onEnd={setAtEnd} />
      </main>

      <FinalOverlay visible={showOverlay} onClose={closeOverlay} />
      {lb !== null && <Lightbox idx={lb} setIdx={setLb} />}
      <MiniPlayer player={player} visible={opened} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
